<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Alata&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <section id="contact">
      <h1 class="text-center font-bold text-2xl p-4">Contact Me</h1>
      <form
        id="contact-form"
        class="max-w-xl mx-auto p-6 bg-white rounded-lg shadow-md space-y-6"
      >
        <!-- Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700"
            >Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black"
          />
        </div>

        <!-- Phone -->
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700"
            >Phone</label
          >
          <input
            type="tel"
            id="phone"
            name="phone"
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black"
          />
        </div>

        <!-- Message -->
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700"
            >Message</label
          >
          <textarea
            id="message"
            name="message"
            rows="4"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black"
          ></textarea>
        </div>

        <!-- Submit -->
        <div class="text-right">
          <button
            type="submit"
            class="bg-black text-white px-6 py-2 rounded-md hover:bg-gray-800 transition"
          >
            Send Message
          </button>
        </div>
      </form>

      <div class="flex flex-col max-w-full items-end gap-4 p-8">
        <div class="flex flex-row gap-2">
          <div class="relative group w-fit">
            <a href="#"
              ><div
                class="relative z-10 rounded-full p-4 text-black transition-colors duration-300 ease-in-out group-hover:text-white"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  class="w-4 h-4"
                >
                  <path
                    fill="currentColor"
                    d="M8 5.67C6.71 5.67 5.67 6.72 5.67 8S6.72 10.33 8 10.33S10.33 9.28 10.33 8S9.28 5.67 8 5.67M15 8c0-.97 0-1.92-.05-2.89c-.05-1.12-.31-2.12-1.13-2.93c-.82-.82-1.81-1.08-2.93-1.13C9.92 1 8.97 1 8 1s-1.92 0-2.89.05c-1.12.05-2.12.31-2.93 1.13C1.36 3 1.1 3.99 1.05 5.11C1 6.08 1 7.03 1 8s0 1.92.05 2.89c.05 1.12.31 2.12 1.13 2.93c.82.82 1.81 1.08 2.93 1.13C6.08 15 7.03 15 8 15s1.92 0 2.89-.05c1.12-.05 2.12-.31 2.93-1.13c.82-.82 1.08-1.81 1.13-2.93c.06-.96.05-1.92.05-2.89m-7 3.59c-1.99 0-3.59-1.6-3.59-3.59S6.01 4.41 8 4.41s3.59 1.6 3.59 3.59s-1.6 3.59-3.59 3.59m3.74-6.49c-.46 0-.84-.37-.84-.84s.37-.84.84-.84s.84.37.84.84a.8.8 0 0 1-.24.59a.8.8 0 0 1-.59.24Z"
                  />
                </svg>
              </div>
            </a>

            <!-- Background: gray circle base -->
            <span class="absolute inset-0 z-0 rounded-full bg-gray-200"></span>

            <!-- Expanding black circle -->
            <span
              class="absolute inset-0 z-0 rounded-full bg-black scale-0 group-hover:scale-100 transition-transform duration-500 ease-out"
            ></span>
          </div>
          <div class="relative group w-fit">
            <a href="#"
              ><div
                class="relative z-10 rounded-full p-4 text-black transition-colors duration-300 ease-in-out group-hover:text-white"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  class="w-4 h-4"
                >
                  <path
                    fill="currentColor"
                    d="M20.47 2H3.53a1.45 1.45 0 0 0-1.47 1.43v17.14A1.45 1.45 0 0 0 3.53 22h16.94a1.45 1.45 0 0 0 1.47-1.43V3.43A1.45 1.45 0 0 0 20.47 2M8.09 18.74h-3v-9h3ZM6.59 8.48a1.56 1.56 0 1 1 0-3.12a1.57 1.57 0 1 1 0 3.12m12.32 10.26h-3v-4.83c0-1.21-.43-2-1.52-2A1.65 1.65 0 0 0 12.85 13a2 2 0 0 0-.1.73v5h-3v-9h3V11a3 3 0 0 1 2.71-1.5c2 0 3.45 1.29 3.45 4.06Z"
                  />
                </svg>
              </div>
            </a>

            <!-- Background: gray circle base -->
            <span class="absolute inset-0 z-0 rounded-full bg-gray-200"></span>

            <!-- Expanding black circle -->
            <span
              class="absolute inset-0 z-0 rounded-full bg-black scale-0 group-hover:scale-100 transition-transform duration-500 ease-out"
            ></span>
          </div>
        </div>
        <div class="flex flex-col items-end">
          <h4 class="font-semibold text-ink-light">(Inquiries)</h4>
          <a class="underline" href="mailto:jefferytan.design@gmail.com">
            jefferytan.design@gmail.com
          </a>
        </div>
      </div>
    </section>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
