<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Alata&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <div
      id="nav-wrapper"
      class="w-full flex fixed z-50 bg-white shadow-md opacity-100 transition-all duration-500 ease-in-out items-center"
    >
      <a href="/">
        <img
          src="/src/img/jeff-logo.svg"
          alt="Jeff Logo"
          class="w-16 h-auto pl-4"
      /></a>
      <button
        id="burger"
        class="p-4 ml-auto z-50 focus:outline-none group opacity-100 transition-opacity duration-300 flex flex-col"
      >
        <div
          class="line1 w-6 h-0.5 bg-black mb-1 transition-all duration-300 ease-in-out"
        ></div>
        <div
          class="line2 w-6 h-0.5 bg-black mb-1 transition-all duration-300 ease-in-out"
        ></div>
        <div
          class="line3 w-6 h-0.5 bg-black transition-all duration-300 ease-in-out"
        ></div>
      </button>
    </div>
    <nav
      id="mobile-nav"
      class="fixed inset-0 bg-black bg-opacity-90 hidden flex flex-col justify-center items-center space-y-6 z-40 text-white text-2xl transition-opacity duration-300"
    >
      <a href="/" class="opacity-0 transition-all duration-500">Home</a>
      <a href="#projects" class="opacity-0 transition-all duration-500"
        >View My Works</a
      >
      <a href="/contact" class="opacity-0 transition-all duration-500"
        >Contact Me</a
      >
      <a
        href="https://www.notion.so/Jeffery-Tan-23b961c512fe80978ad6ea17c8b404fa?source=copy_link"
        target="_blank"
        class="opacity-0 transition-all duration-500"
        >CV
      </a>
    </nav>

    <main>
      <div class="mt-24">
        <div
          id="compareContainer"
          class="relative w-full max-w-[600px] h-[64vw] max-h-[400px] mx-auto overflow-hidden select-none"
        >
          <!-- Old image with AFTER label (base layer) -->
          <div class="absolute inset-0">
            <img
              src="/src/img/new-website.png"
              alt="Old"
              class="absolute inset-0 w-full h-full object-cover pointer-events-none"
            />
            <div
              class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"
            >
              <span class="bg-black/60 text-white text-lg px-3 py-1 rounded"
                >After</span
              >
            </div>
          </div>

          <!-- New image mask with BEFORE label (clipped layer) -->
          <div
            id="newImageWrapper"
            class="absolute inset-0 overflow-hidden"
            style="width: 50%"
          >
            <img
              src="/src/img/old-website.png"
              alt="New"
              class="absolute inset-0 w-full h-full object-cover pointer-events-none"
            />
            <div
              class="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none"
            >
              <span class="bg-black/60 text-white text-lg px-3 py-1 rounded"
                >Before</span
              >
            </div>
          </div>

          <!-- Divider line -->
          <div
            id="sliderLine"
            class="absolute top-0 bottom-0 w-0.5 bg-white"
            style="left: 50%"
          ></div>

          <!-- Handle -->
          <div
            id="sliderHandle"
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white border-2 border-gray-400 shadow cursor-pointer touch-none"
          ></div>
        </div>
      </div>
    </main>
    <script type="module" src="../src/js/main.js"></script>
  </body>
</html>
